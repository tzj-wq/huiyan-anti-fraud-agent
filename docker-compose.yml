services:
  mysql:
    image: mysql:8.0
    container_name: huiyan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MYSQL_DATABASE: huiyan
      MYSQL_USER: huiyan
      MYSQL_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: huiyan-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
