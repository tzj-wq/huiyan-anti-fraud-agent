name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试（81 项，含 6-Agent / LangGraph / RAG 套件）
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 运行测试
        working-directory: backend
        run: python -m pytest ../test tests/ -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建（tsc + vite build）
        working-directory: frontend
        run: npm run build

  eval:
    name: 评估体系测试（含 ML 基线）
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/scripts/requirements-eval.txt
      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/scripts/requirements-eval.txt
      - name: 运行评估测试
        working-directory: backend
        run: python -m pytest ../test/unit/test_eval_dataset.py ../test/unit/test_ml_baseline.py -q
